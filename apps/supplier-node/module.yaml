name: supplier-node
description: Hardened provider-neutral HTTPS inference gateway for individual and organization suppliers.
owners:
  - marketplace-supplier-runtime
public_api:
  - apps/supplier-node/src/runtime.ts
  - apps/supplier-node/src/provider-adapter.ts
  - apps/supplier-node/src/public.ts
depends_on:
  - protocol
used_by:
  - web
  - supplier-agent
test_commands:
  - npx pnpm@9.15.0 --filter @token-streaming/supplier-node test
rules:
  - Never route customer prompts through local Codex or any developer session.
  - Never log prompts, outputs, bearer credentials, upstream credentials, or authorization headers.
  - Accept only the signed versioned supplier-gateway protocol and exact configured models and data classes.
  - Expose only minimal public readiness; require signed one-time challenges for Provider, model, data-class, and capacity attestation.
  - Keep upstream authentication and native request, response, usage, and error fields inside provider adapters.
  - Reject arbitrary URLs, redirects, tools, shell execution, file access, and unconfigured provider hosts.
  - Bind to loopback by default and place public deployments behind a terminating HTTPS reverse proxy.
  - Persist replay journal v2 with hashed identifiers, expiries, and a gateway-token-keyed domain-separated HMAC commitment to each request-body digest; never persist raw body digests, prompts, outputs, credentials, signatures, or authorization headers.
  - Require SupplierNodeConfig.replayJournalPath to resolve to a non-empty durable path and refuse startup rather than degrading to memory-only replay protection.
  - Fully append and fsync nonce and request claims before upstream execution; migrate live v1 records to keyed v2 at startup while preserving their replay semantics.
  - Compact atomically through an fsynced private temporary file and rename every five minutes, after 1,000 appends, at 8 MiB, or before crossing the hard 16 MiB limit.
  - Preserve the journal across process and container restarts; fail startup on corruption, duplicates, or unsafe size, and make readiness plus all later claims fail closed after any append or compaction failure.
  - Mount the container journal on its dedicated named state volume while keeping the root filesystem read-only.
  - Permit only one active journal writer per gateway token; active-active HA requires a shared atomic replay-claim store, and a shared volume alone is insufficient.
  - Require the upstream response model to match the requested exact model and sign canonical per-job execution evidence before returning a billable response.
  - Treat artifact bytes as untrusted, non-executable data; verify ordered chunk and whole-content digests before signing aggregate evidence.
  - Enforce monotonic resumable checkpoints and a caller-approved full-task token ceiling across map and reduce calls.
  - Accept only artifact-worker.v2 assignments with an explicit standard/strict privacy mode and fail cancelled leases non-retryably.
