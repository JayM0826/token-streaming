name: protocol
description: Shared TypeScript contracts for coding sessions and the provider-neutral compute-capacity marketplace.
owners:
  - core-runtime
public_api:
  - packages/protocol/src/index.ts
depends_on: []
used_by:
  - core
  - ai-manifest
  - tools
  - storage
  - providers
  - cli
  - marketplace-domain
  - web
test_commands:
  - npx pnpm@9.15.0 --filter @token-streaming/protocol test
rules:
  - Keep this package dependency-light.
  - Do not import runtime packages from protocol.
  - Keep individual and organization suppliers in one versioned contract with kind-specific verification policy.
  - Represent provider authorization scope explicitly, including data classes and capacity ceilings.
  - Never add passwords, cookies, API keys, reusable tokens, or raw identity documents to marketplace contracts.
  - Keep browser-facing marketplace views free of tenant identifiers and encrypted credential fields.
  - Keep supplier-gateway contracts provider-neutral and version breaking wire changes explicitly.
  - Keep signature canonicalization deterministic and free of runtime dependencies.
  - Bind every billable response to canonical execution evidence covering Provider, requested and served model, request ID, input/output digests, usage, and completion time.
  - Keep large-file bytes out of JSON contracts; publish only bounded artifact manifests, chunk descriptors, leases, progress, and signed execution evidence.
  - Represent artifact-task cancellation explicitly and keep leased cancellation two-phase so reservations cannot release before execution is terminal.
  - Make supplier plaintext visibility, privacy mode, retention summary, and buyer-owned purge operations explicit in versioned contracts.

