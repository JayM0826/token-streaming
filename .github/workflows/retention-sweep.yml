name: Retention sweep

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketplace-retention-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify cryptographic recovery boundary
        env:
          MARKETPLACE_MAINTENANCE_KEY: ${{ secrets.MARKETPLACE_MAINTENANCE_KEY }}
        run: |
          test -n "$MARKETPLACE_MAINTENANCE_KEY"
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          http_code="$(curl --silent --show-error \
            --output "$response_file" --write-out '%{http_code}' \
            --retry 3 --retry-all-errors --max-time 60 \
            -X POST \
            -H "Accept: application/json" \
            -H "Authorization: Bearer $MARKETPLACE_MAINTENANCE_KEY" \
            https://gongsuanyun-market.wenzaiyin.chatgpt.site/api/internal/cryptography/preflight)"
          test "$http_code" = "200"
          python3 - "$response_file" <<'PY'
          import json
          import pathlib
          import sys

          payload = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          if payload.get("ok") is not True or payload.get("ready") is not True:
              raise SystemExit("cryptographic preflight did not confirm runtime readiness")
          if payload.get("minimumReaderVersion") != 3:
              raise SystemExit("unexpected minimum cryptographic reader version")
          if payload.get("invalidPersistedReferences") != 0:
              raise SystemExit("persisted cryptographic format/key-id references are invalid")
          domains = payload.get("domains")
          if not isinstance(domains, list) or len(domains) != 2:
              raise SystemExit("cryptographic preflight domain inventory is incomplete")
          for domain in domains:
              if domain.get("unknownReferencedKeyIds") != []:
                  raise SystemExit("a persisted row references an unavailable key id")
              for key in domain.get("keys", []):
                  if key.get("state") == "readable" and key.get("canary") != "valid":
                      raise SystemExit("a readable key does not have a valid canary")
                  if key.get("safeToDestroy") is not False:
                      raise SystemExit("the application must never approve final key destruction")
          print(f"cryptographic preflight completed at {payload.get('checkedAt', 'unknown')}")
          PY

      - name: Purge expired marketplace content
        env:
          MARKETPLACE_MAINTENANCE_KEY: ${{ secrets.MARKETPLACE_MAINTENANCE_KEY }}
        run: |
          test -n "$MARKETPLACE_MAINTENANCE_KEY"
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          http_code="$(curl --silent --show-error \
            --output "$response_file" --write-out '%{http_code}' \
            --retry 3 --retry-all-errors --max-time 60 \
            -X POST \
            -H "Accept: application/json" \
            -H "Authorization: Bearer $MARKETPLACE_MAINTENANCE_KEY" \
            https://gongsuanyun-market.wenzaiyin.chatgpt.site/api/internal/maintenance)"
          test "$http_code" = "200"
          python3 - "$response_file" <<'PY'
          import json
          import pathlib
          import sys

          payload = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          if payload.get("ok") is not True or not isinstance(payload.get("requestId"), str):
              raise SystemExit("maintenance response did not confirm success")
          if int(payload.get("overdueArtifactDeletions", 0)) > 500:
              raise SystemExit("artifact deletion queue exceeds the monitored overdue threshold")
          if int(payload.get("artifactDeletionRetentionBreaches", 0)) > 0:
              raise SystemExit("artifact deletion exceeded its retention deadline")
          if int(payload.get("unclaimedExpiredArtifacts", 0)) > 500:
              raise SystemExit("unclaimed expired artifact backlog exceeds the monitored threshold")
          if int(payload.get("unclaimedArtifactRetentionBreaches", 0)) > 0:
              raise SystemExit("an expired artifact was not tombstoned within the retry horizon")
          if int(payload.get("pendingArtifactTombstones", 0)) > 256:
              raise SystemExit("artifact generation tombstone backlog exceeds the monitored threshold")
          if int(payload.get("artifactTombstoneRetentionBreaches", 0)) > 0:
              raise SystemExit("an artifact generation was not tombstoned within the retry horizon")
          if payload.get("cryptographicConfiguration") != "valid":
              raise SystemExit("runtime cryptographic configuration was not validated")
          if payload.get("cryptographicCanaries") != "valid":
              raise SystemExit("runtime cryptographic key canaries were not validated")
          legacy_content_refs = payload.get("legacyCredentialContentReferences")
          if not isinstance(legacy_content_refs, int) or legacy_content_refs < 0:
              raise SystemExit("legacy credential content reference count was not reported")
          print(f"retention sweep completed at {payload.get('executedAt', 'unknown')}")
          PY
