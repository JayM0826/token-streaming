default:
  - corepack pnpm@9.15.0 build
  - corepack pnpm@9.15.0 test
  - corepack pnpm@9.15.0 package:install-check
launch:
  - corepack pnpm@9.15.0 launch:check
behavior:
  - node --test "packages/**/*.test.mjs"
cli_behavior:
  - node --test "apps/**/*.test.mjs"
cli_smoke:
  - npx pnpm@9.15.0 --filter @token-streaming/cli start -- --provider stub --dry-run "summarize this repo"
supplier_agent:
  - npx pnpm@9.15.0 --filter @token-streaming/supplier-agent test
supplier_node:
  - npx pnpm@9.15.0 --filter @token-streaming/supplier-node test
artifact_data_plane:
  - npx pnpm@9.15.0 --filter @token-streaming/marketplace-domain test
  - npx pnpm@9.15.0 --filter @token-streaming/supplier-node test
  - npx pnpm@9.15.0 --filter @token-streaming/supplier-agent test
  - npx pnpm@9.15.0 --dir apps/web build
privacy_security:
  - node --test "apps/web/test/**/*.test.mjs"
  - npx pnpm@9.15.0 --filter @token-streaming/marketplace-domain test
  - npx pnpm@9.15.0 --filter @token-streaming/supplier-agent test
  - npx pnpm@9.15.0 --dir apps/web typecheck
